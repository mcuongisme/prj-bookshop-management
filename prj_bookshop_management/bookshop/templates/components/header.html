<header class="bg-white shadow-sm border-b border-gray-200">
    <div class="flex items-center justify-between px-6 py-4">
        <!-- Left Section -->
        <div class="flex items-center gap-4">
            <h2 class="text-xl font-semibold text-gray-800">
                Test
                {% comment %} {% block page_title %}Quản Lý Hóa Đơn{% endblock %} {% endcomment %}
            </h2>
        </div>

        <!-- Right Section -->
        <div class="flex items-center gap-6">
            <!-- Search (Optional) -->
            <div class="hidden md:flex">
                <input 
                    type="search" 
                    placeholder="Tìm kiếm..." 
                    class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 w-64"
                >
            </div>

            <!-- Icons -->
            <button class="text-gray-600 hover:text-gray-900 transition">
                <i class="fas fa-bell text-lg"></i>
            </button>

            <button class="text-gray-600 hover:text-gray-900 transition">
                <i class="fas fa-sync text-lg"></i>
            </button>

            <!-- User Profile -->
            <div class="flex items-center gap-3 pl-4 border-l border-gray-300">
                <div class="text-right">
                    <p class="text-sm font-medium text-gray-800">{{ user.first_name }} {{ user.last_name }}</p>
                    <p class="text-xs text-gray-500">Admin</p>
                </div>
                <img 
                    src="https://via.placeholder.com/40/40" 
                    alt="Profile" 
                    class="w-10 h-10 rounded-full"
                >
            </div>

            <!-- Logout -->
            <a href="{% url 'logout' %}" class="text-gray-600 hover:text-red-600 transition">
                <i class="fas fa-sign-out-alt text-lg"></i>
            </a>
        </div>
    </div>
</header>
