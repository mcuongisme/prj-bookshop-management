{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h2 mb-0">Danh sách khách hàng</h1>
    <a href="{% url 'khachhang_create' %}" class="btn btn-primary">
      <i class="bi bi-plus-circle me-2"></i>Thêm khách hàng
    </a>
  </div>

  <div class="table-responsive">
    <table class="table table-hover table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th>Số điện thoại</th>
          <th>Địa chỉ</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody>
        {% for kh in khachhangs %}
        <tr>
          <td>{{ kh.sdt }}</td>
          <td>{{ kh.dia_chi }}</td>
          <td>
            <a href="{% url 'khachhang_update' kh.sdt %}" class="btn btn-sm btn-primary">
              <i class="bi bi-pencil-square"></i>
            </a>
            <a href="{% url 'khachhang_delete' kh.sdt %}" class="btn btn-sm btn-danger">
              <i class="bi bi-trash"></i>
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
